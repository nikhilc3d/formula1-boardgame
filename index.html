<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formula 1 Boardgame</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#3d7a2d;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

.title{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:200;

    color:white;
    font-size:42px;
    font-weight:900;
    letter-spacing:2px;
    text-transform:uppercase;

    text-shadow:
        0 0 10px rgba(0,0,0,0.5),
        0 0 20px rgba(0,0,0,0.3);

    font-family:
        Impact,
        Arial Black,
        sans-serif;
}

.ui{
    position:absolute;
    top:100px;
    left:20px;
    z-index:100;

    display:flex;
    align-items:flex-start;
    gap:16px;

    flex-wrap:wrap;
    width:340px;
}

.button-group{
    display:flex;
    flex-direction:column;
    gap:10px;
}

button{
    padding:14px 24px;
    font-size:20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    color:white;
    font-weight:bold;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
}

#rollBtn{
    background:#ff9800;
}

#autoBtn{
    background:#43a047;
}

#stopBtn{
    background:#d32f2f;
}

#startRaceBtn{
    background:#1976d2;
}

.info{
    color:white;
    font-size:22px;
    font-weight:bold;
    min-width:260px;
}

.dice{
    width:90px;
    height:90px;
    background:white;
    border-radius:16px;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);

    padding:10px;
    gap:4px;

    box-shadow:
        0 0 15px rgba(0,0,0,0.4);
}

.dot{
    width:16px;
    height:16px;
    background:black;
    border-radius:50%;
    align-self:center;
    justify-self:center;
    opacity:0;
}

.leaderboard{
    position:absolute;
    top:120px;
    right:20px;
    width:320px;

    background:
        rgba(0,0,0,0.78);

    border-radius:20px;

    padding:18px;

    color:white;

    z-index:300;

    backdrop-filter:blur(8px);

    box-shadow:
        0 0 20px rgba(0,0,0,0.4);
}

.leaderboard-title{
    font-size:28px;
    font-weight:900;
    margin-bottom:14px;
    text-align:center;
    text-transform:uppercase;
}

#leaderboardTable{
    width:100%;
    border-collapse:collapse;
}

#leaderboardTable tr{
    border-bottom:
        1px solid rgba(255,255,255,0.12);
}

#leaderboardTable td{
    padding:8px 4px;
    font-size:16px;
}

.race-settings{
    position:absolute;
    left:20px;
    top:340px;
    width:320px;

    background:
        rgba(0,0,0,0.78);

    border-radius:20px;

    padding:18px;

    color:white;

    z-index:300;

    backdrop-filter:blur(8px);

    box-shadow:
        0 0 20px rgba(0,0,0,0.35);

    max-height:520px;

    overflow-y:auto;
}

.settings-title{
    font-size:26px;
    font-weight:900;
    margin-bottom:16px;
    text-align:center;
    text-transform:uppercase;
}

.settings-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
}

.settings-row input{
    width:80px;
    padding:8px;
    border:none;
    border-radius:10px;
    text-align:center;
    font-size:16px;
}

.pit-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
}

.pit-row input{
    width:70px;
    padding:6px;
    border:none;
    border-radius:8px;
    text-align:center;
    font-size:15px;
}

</style>
</head>
<body>

<div class="title">
    Formula 1 Boardgame
</div>

<div class="ui">

    <div class="dice">

        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>

        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>

        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>

    </div>

    <div class="button-group">

        <button id="rollBtn">
            ROLL
        </button>

        <button id="autoBtn">
            AUTOPLAY
        </button>

        <button id="stopBtn">
            STOP
        </button>

    </div>

    <div class="info" id="info">
        Configure Race
    </div>

</div>

<div class="race-settings">

    <div class="settings-title">
        Race Settings
    </div>

    <div class="settings-row">

        <label>Total Laps</label>

        <input
            type="number"
            id="lapCount"
            min="2"
            max="99"
            value="5"
        >
    </div>

    <div id="pitStrategyContainer"></div>

    <button id="startRaceBtn">
        START RACE
    </button>

</div>

<div class="leaderboard">

    <div class="leaderboard-title">
        Leaderboard
    </div>

    <table id="leaderboardTable"></table>

</div>

<canvas id="canvas"></canvas>

<audio id="bgMusic" autoplay loop>
    <source src="soundtrack.mp3" type="audio/mpeg">
</audio>

<script>

/* ========================================
BACKGROUND MUSIC
======================================== */

const bgMusic =
    document.getElementById(
        "bgMusic"
    );

bgMusic.volume = 0.35;

document.addEventListener(
    "click",
    ()=>{

        if(bgMusic.paused){

            bgMusic.play();
        }

    },
    { once:true }
);

/* ========================================
CANVAS
======================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

canvas.width = innerWidth;
canvas.height = innerHeight;

/* ========================================
CAR DATABASE
======================================== */

const carData = [

    { name:"Ferrari", image:"ferrari.png" },
    { name:"McLaren", image:"mclaren.png" },
    { name:"BMW", image:"bmw.png" },
    { name:"Renault", image:"renault.png" },
    { name:"Toyota", image:"toyota.png" },
    { name:"STR", image:"str.png" },
    { name:"RedBull", image:"redbull.png" },
    { name:"Williams", image:"williams.png" },
    { name:"Honda", image:"honda.png" },
    { name:"Force India", image:"forceindia.png" }

];

carData.forEach(car=>{

    const img = new Image();

    img.src = car.image;

    car.img = img;
});

/* ========================================
TRACK
======================================== */

const rawPath = [

    [120,650],[250,650],[400,650],[600,650],
    [850,650],[1050,650],[1150,600],[1120,500],
    [1070,380],[1020,260],[960,140],[880,90],
    [790,180],[720,260],[690,350],[740,430],
    [860,470],[940,520],[910,590],[780,590],
    [620,590],[470,590],[330,590],[250,550],
    [240,470],[290,410],[390,410],[500,440],
    [610,450],[670,390],[620,330],[540,270],
    [520,190],[450,160],[390,110],[310,50],
    [240,40],[220,160],[200,300],[170,470],
    [120,650]
];

const rawPitPath = [

    [320,660],
    [470,700],
    [620,700],
    [780,700],
    [930,700],
    [1080,640]
];

let path = [];
let pitPath = [];

function centerTrack(){

    let minX = Infinity;
    let maxX = -Infinity;

    let minY = Infinity;
    let maxY = -Infinity;

    rawPath.forEach(p=>{

        minX = Math.min(minX,p[0]);
        maxX = Math.max(maxX,p[0]);

        minY = Math.min(minY,p[1]);
        maxY = Math.max(maxY,p[1]);
    });

    const trackWidth =
        maxX - minX;

    const trackHeight =
        maxY - minY;

    const scale =
        Math.min(

            canvas.width /
            (trackWidth + 500),

            canvas.height /
            (trackHeight + 200)
        );

    const offsetX =

        (canvas.width -
        trackWidth * scale) / 2

        - minX * scale;

    const offsetY =

        (canvas.height -
        trackHeight * scale) / 2

        - minY * scale;

    path = rawPath.map(p=>{

        return [

            p[0] * scale + offsetX,

            p[1] * scale + offsetY
        ];
    });

    pitPath = rawPitPath.map(p=>{

        return [

            p[0] * scale + offsetX,

            p[1] * scale + offsetY
        ];
    });
}

centerTrack();

/* ========================================
TRACK TILES
======================================== */

let tiles = [];
let pitTiles = [];

const PIT_ENTRY_INDEX = 18;
const PIT_EXIT_INDEX = 8;

function generateTiles(){

    tiles = [];

    for(let i=0;i<path.length-1;i++){

        const start = path[i];
        const end = path[i+1];

        const dx = end[0] - start[0];
        const dy = end[1] - start[1];

        const dist =
            Math.sqrt(dx*dx + dy*dy);

        const spacing = 42;

        const steps =
            Math.floor(dist / spacing);

        for(let j=0;j<steps;j++){

            const t = j / steps;

            tiles.push({

                x:start[0] + dx*t,
                y:start[1] + dy*t
            });
        }
    }
}

function generatePitTiles(){

    pitTiles = [];

    for(let i=0;i<pitPath.length-1;i++){

        const start = pitPath[i];
        const end = pitPath[i+1];

        const dx = end[0] - start[0];
        const dy = end[1] - start[1];

        const dist =
            Math.sqrt(dx*dx + dy*dy);

        const spacing = 42;

        const steps =
            Math.floor(dist / spacing);

        for(let j=0;j<steps;j++){

            const t = j / steps;

            pitTiles.push({

                x:start[0] + dx*t,
                y:start[1] + dy*t
            });
        }
    }
}

generateTiles();
generatePitTiles();

/* ========================================
PLAYERS
======================================== */

const TOTAL_CARS =
    carData.length;

const GRID_SPACING = 2;

const players = [];

for(let i=0;i<TOTAL_CARS;i++){

    players.push({

        index:i * GRID_SPACING + 5,

        laps:0,

        image:carData[i].img,

        name:carData[i].name,

        inPit:false,

        pitProgress:0,

        pitLap:1,

        hasPitted:false,

        diceRolls:0,

        finished:false
    });
}

/* ========================================
RACE
======================================== */

let totalRaceLaps = 5;

let raceStarted = false;

let raceFinished = false;

let finishedCars = 0;

let currentTurn = 0;

let firstCycleComplete = false;

let currentRoundOrder = [];

let isAnimating = false;

let autoPlay = false;

/* ========================================
DICE POOLS
======================================== */

const dicePools = [

    [6,6,6,6,6,5,5,4,4,4],
    [6,6,6,6,6,5,5,4,4,4],
    [6,6,6,6,5,5,5,4,4,4],
    [6,6,6,5,5,5,5,4,4,4],
    [6,6,6,5,5,5,4,4,4,4],
    [6,6,5,5,5,4,4,4,4,4],
    [6,6,5,5,5,4,4,4,4,4],
    [6,6,5,5,5,4,4,4,4,4],
    [6,6,5,5,4,4,4,4,4,4],
    [6,5,5,5,5,4,4,4,4,4]
];

/* ========================================
UI
======================================== */

const rollBtn =
    document.getElementById("rollBtn");

const autoBtn =
    document.getElementById("autoBtn");

const stopBtn =
    document.getElementById("stopBtn");

const startRaceBtn =
    document.getElementById(
        "startRaceBtn"
    );

const info =
    document.getElementById("info");

const pitStrategyContainer =
    document.getElementById(
        "pitStrategyContainer"
    );

/* ========================================
PIT UI
======================================== */

function buildPitStrategyUI(){

    pitStrategyContainer.innerHTML = "";

    carData.forEach((car,index)=>{

        pitStrategyContainer.innerHTML += `

            <div class="pit-row">

                <label>${car.name}</label>

                <input
                    type="number"
                    id="pitLap_${index}"
                    min="1"
                    value="1"
                >

            </div>
        `;
    });
}

buildPitStrategyUI();

function syncPitLapLimits(){

    const totalLaps =
        parseInt(
            document.getElementById(
                "lapCount"
            ).value
        );

    const maxPitLap =
        Math.max(
            1,
            totalLaps - 1
        );

    carData.forEach((car,index)=>{

        const input =
            document.getElementById(
                `pitLap_${index}`
            );

        input.max = maxPitLap;

        if(
            parseInt(input.value)
            > maxPitLap
        ){

            input.value =
                maxPitLap;
        }
    });
}

syncPitLapLimits();

document
.getElementById("lapCount")
.addEventListener(
    "input",
    syncPitLapLimits
);

/* ========================================
DICE UI
======================================== */

const dots =
    document.querySelectorAll(".dot");

const faces = {

    1:[4],
    2:[0,8],
    3:[0,4,8],
    4:[0,2,6,8],
    5:[0,2,4,6,8],
    6:[0,2,3,5,6,8]
};

function showDice(num){

    dots.forEach(dot=>{

        dot.style.opacity = 0;
    });

    faces[num].forEach(i=>{

        dots[i].style.opacity = 1;
    });
}

/* ========================================
PROGRESS
======================================== */

function getTrueProgress(player){

    
    /*
    base race distance
    */

    const lapDistance =
        player.laps * tiles.length;

    /*
    PITLANE
    */

    if(player.inPit){

        /*
        pit progress continues forward
        */

        return (

            lapDistance +

            (
                tiles.length -
                PIT_ENTRY_INDEX
            )

            +

            (
                pitTiles.length -
                player.pitProgress
            )

            * 0.1
        );
    }

    /*
    NORMAL TRACK
    */

    return (

        lapDistance +

        (
            tiles.length -
            player.index
        )
    );
}

/* ========================================
LEADERBOARD
======================================== */

function updateLeaderboard(){

    const table =
        document.getElementById(
            "leaderboardTable"
        );

    if(raceFinished){

        const results =
            [...players];

        results.sort((a,b)=>{

            return a.diceRolls -
                   b.diceRolls;
        });

        table.innerHTML = "";

        results.forEach((car,index)=>{

            table.innerHTML += `

                <tr>

                    <td>${index + 1}</td>

                    <td>${car.name}</td>

                    <td>${car.diceRolls} Rolls</td>

                </tr>
            `;
        });

        return;
    }

    const standings =
        [...players];

    standings.sort((a,b)=>{

        return getTrueProgress(b)
             - getTrueProgress(a);
    });

    table.innerHTML = "";

    standings.forEach((car,index)=>{

        table.innerHTML += `

            <tr>

                <td>${index + 1}</td>

                <td>${car.name}</td>

                <td>L${car.laps}</td>

            </tr>
        `;
    });
}

function getRaceOrder(){

    const standings =
        [...players];

    standings.sort((a,b)=>{

        const progressDiff =

            getTrueProgress(b)
            -
            getTrueProgress(a);

        /*
        stable tiebreaker
        */

        if(
            Math.abs(progressDiff)
            < 0.0001
        ){

            return (
                a.diceRolls -
                b.diceRolls
            );
        }

        return progressDiff;
    });

    return standings;
}

function buildRoundOrder(){

    if(!firstCycleComplete){

        currentRoundOrder =
            [...players];

        return;
    }

    currentRoundOrder =
        getRaceOrder();
}

buildRoundOrder();

/* ========================================
DRAW TRACK
======================================== */

function drawTrack(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle = "#3d7a2d";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /*
    TRACK
    */

    ctx.beginPath();

    ctx.moveTo(path[0][0],path[0][1]);

    for(let i=1;i<path.length;i++){

        ctx.lineTo(path[i][0],path[i][1]);
    }

    ctx.lineWidth = 54;
    ctx.strokeStyle = "#111";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(path[0][0],path[0][1]);

    for(let i=1;i<path.length;i++){

        ctx.lineTo(path[i][0],path[i][1]);
    }

    ctx.lineWidth = 42;
    ctx.strokeStyle = "#999";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke();

    /*
    PITLANE
    */

    ctx.beginPath();

    ctx.moveTo(
        pitPath[0][0],
        pitPath[0][1]
    );

    for(let i=1;i<pitPath.length;i++){

        ctx.lineTo(
            pitPath[i][0],
            pitPath[i][1]
        );
    }

    ctx.lineWidth = 20;
    ctx.strokeStyle = "#d9d9d9";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke();

    /*
    NODES
    */

    for(const tile of tiles){

        ctx.beginPath();

        ctx.arc(
            tile.x,
            tile.y,
            4,
            0,
            Math.PI*2
        );

        ctx.fillStyle = "white";
        ctx.fill();
    }

    /*
    OCCUPANCY
    */

    const occupancy = {};
    const resolvedPositions = [];

    players.forEach((player,index)=>{

        let baseIndex =
            player.inPit
            ? player.pitProgress
            : player.index;

        let isPit =
            player.inPit;

        let resolvedIndex =
            baseIndex;

        while(true){

            const key =
                (isPit ? "pit_" : "track_")
                + resolvedIndex;

            if(!occupancy[key]){

                occupancy[key] = [];
            }

            if(
                occupancy[key].length < 2
            ){

                occupancy[key].push(index);

                resolvedPositions[index] = {

                    tile:resolvedIndex,

                    slot:
                        occupancy[key].length - 1,

                    isPit:isPit
                };

                break;
            }

            resolvedIndex++;

            if(!isPit){

                resolvedIndex =
                    resolvedIndex %
                    tiles.length;
            }
        }
    });

    /*
    DRAW CARS
    */

    players.forEach((player,index)=>{

        const resolved =
            resolvedPositions[index];

        let p;

        if(resolved.isPit){

            p =
                pitTiles[
                    resolved.tile
                ];

        }else{

            p =
                tiles[
                    resolved.tile
                ];
        }

        const prev =
            tiles[
                (player.index + 1)
                % tiles.length
            ];

        const next =
            tiles[
                (player.index - 1 + tiles.length)
                % tiles.length
            ];

        const dx =
            next.x - prev.x;

        const dy =
            next.y - prev.y;

        const angle =
            Math.atan2(dy,dx);

        let lateralOffset = 0;

        if(resolved.slot === 0){

            lateralOffset = -9;
        }

        if(resolved.slot === 1){

            lateralOffset = 9;
        }

        const perpX =
            Math.cos(
                angle + Math.PI/2
            );

        const perpY =
            Math.sin(
                angle + Math.PI/2
            );

        const finalX =
            p.x + perpX * lateralOffset;

        const finalY =
            p.y + perpY * lateralOffset;

        ctx.save();

        ctx.translate(
            finalX,
            finalY
        );

        ctx.rotate(
            angle + Math.PI/2
        );

        const img =
            player.image;

        if(img.complete){

            const maxSize = 34;

            const aspect =
                img.width / img.height;

            let drawWidth;
            let drawHeight;

            if(aspect >= 1){

                drawWidth = maxSize;

                drawHeight =
                    maxSize / aspect;

            }else{

                drawHeight = maxSize;

                drawWidth =
                    maxSize * aspect;
            }

            ctx.drawImage(

                img,

                -drawWidth / 2,
                -drawHeight / 2,

                drawWidth,
                drawHeight
            );
        }

        ctx.restore();

        /*
        GRID NUMBER
        */

        ctx.save();

        ctx.font =
            "bold 14px Arial";

        ctx.textAlign = "center";

        ctx.lineWidth = 4;

        ctx.strokeStyle = "black";

        ctx.strokeText(
            index + 1,
            finalX + 18,
            finalY - 18
        );

        ctx.fillStyle = "white";

        ctx.fillText(
            index + 1,
            finalX + 18,
            finalY - 18
        );

        ctx.restore();
    });

    updateLeaderboard();
}

drawTrack();

/* ========================================
FINAL RESULTS
======================================== */

function finishRace(){

    raceFinished = true;

    raceStarted = false;

    autoPlay = false;

    updateLeaderboard();

    const winner =
        [...players]
        .sort((a,b)=>{

            return a.diceRolls -
                   b.diceRolls;
        })[0];

    info.innerHTML =

        winner.name +

        " WINS (" +

        winner.diceRolls +

        " Rolls)";
}

/* ========================================
TURN ADVANCE
======================================== */

function advanceTurn(){

    currentTurn++;

    if(currentTurn >= TOTAL_CARS){

        currentTurn = 0;

        firstCycleComplete = true;

        buildRoundOrder();
    }
}

/* ========================================
START RACE
======================================== */

startRaceBtn.addEventListener(
    "click",
    ()=>{

        totalRaceLaps = parseInt(
            document.getElementById(
                "lapCount"
            ).value
        );

        players.forEach((player,index)=>{

            player.pitLap = Math.min(

                totalRaceLaps - 1,

                parseInt(
                    document.getElementById(
                        `pitLap_${index}`
                    ).value
                )
            );

            player.hasPitted = false;

            player.diceRolls = 0;

            player.finished = false;

            player.laps = 0;

            player.inPit = false;

            player.pitProgress = 0;

            player.index =
                index * GRID_SPACING + 5;
        });

        raceFinished = false;
        finishedCars = 0;

        currentTurn = 0;
        firstCycleComplete = false;

        buildRoundOrder();

        raceStarted = true;

        drawTrack();

        info.innerHTML =
            "Race Started";
    }
);

/* ========================================
PLAY TURN
======================================== */

async function playTurn(){

    if(!raceStarted) return;

    if(isAnimating) return;

    if(raceFinished) return;

    isAnimating = true;

    const currentPlayer =
        currentRoundOrder[currentTurn];

    if(currentPlayer.finished){

        advanceTurn();

        isAnimating = false;

        return;
    }

    const diceIndex =
        carData.findIndex(
            c=>c.name === currentPlayer.name
        );

    const pool =
        dicePools[diceIndex];

    const value =
        pool[
            Math.floor(
                Math.random() *
                pool.length
            )
        ];

    currentPlayer.diceRolls++;

    showDice(value);

    info.innerHTML =
        currentPlayer.name +
        " rolled " +
        value;

    let shouldEnterPit = false;

    if(

        currentPlayer.laps ===
        currentPlayer.pitLap

        &&

        !currentPlayer.hasPitted

        &&

        !currentPlayer.inPit
    ){

        shouldEnterPit = true;
    }

    let movement = value;

    if(currentPlayer.inPit){

        movement = 3;
    }

    for(let i=0;i<movement;i++){

        if(currentPlayer.inPit){

            currentPlayer.pitProgress--;

            if(
                currentPlayer.pitProgress < 0
            ){

                currentPlayer.inPit = false;

                currentPlayer.hasPitted = true;

                currentPlayer.index =
                    PIT_EXIT_INDEX;
            }

        }else{

            currentPlayer.index--;

            if(currentPlayer.index < 0){

                currentPlayer.index =
                    tiles.length - 1;

                currentPlayer.laps++;

                if(

                    currentPlayer.laps >=
                    totalRaceLaps

                    &&

                    currentPlayer.hasPitted

                    &&

                    !currentPlayer.finished
                ){

                    currentPlayer.finished = true;

                    finishedCars++;

                    if(
                        finishedCars >= TOTAL_CARS
                    ){

                        finishRace();
                    }
                }
            }

            if(

                shouldEnterPit

                &&

                currentPlayer.index ===
                PIT_ENTRY_INDEX
            ){

                currentPlayer.inPit = true;

                currentPlayer.pitProgress =
                    pitTiles.length - 1;
            }
        }

        drawTrack();

        await new Promise(resolve=>{

            setTimeout(
                resolve,
                180
            );

        });
    }

    advanceTurn();

    isAnimating = false;
}

/* ========================================
BUTTONS
======================================== */

rollBtn.addEventListener(
    "click",
    async ()=>{

        if(autoPlay) return;

        await playTurn();
    }
);

async function autoPlayLoop(){

    while(autoPlay){

        await playTurn();

        await new Promise(resolve=>{

            setTimeout(
                resolve,
                400
            );

        });
    }
}

autoBtn.addEventListener(
    "click",
    ()=>{

        if(autoPlay) return;

        autoPlay = true;

        autoPlayLoop();
    }
);

stopBtn.addEventListener(
    "click",
    ()=>{

        autoPlay = false;
    }
);

/* ========================================
RESIZE
======================================== */

window.addEventListener(
    "resize",
    ()=>{

        canvas.width =
            innerWidth;

        canvas.height =
            innerHeight;

        centerTrack();

        generateTiles();

        generatePitTiles();

        drawTrack();
    }
);

</script>

</body>
</html>
